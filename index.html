<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>قائمة المقبولات | الطبيب الحافظ</title>
    <link rel="stylesheet" href="stylesheets/styles.css" />
    <!-- Google Fonts -->
    <link
      href="https://db.onlinewebfonts.com/c/739571e5b3270dd49b19f413b1ef148e?family=F29LT+Bukra+Regular"
      rel="stylesheet"
    />
    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body class="bg-star-pattern">
    <main>
      <header id="header-logo" class="striped-pattern shared-filter">
        <div class="logo-container">
          <span class="masked-icon logo-icon"></span>
          <span class="masked-icon logo-text"></span>
        </div>
        <div class="interlace"></div>
      </header>

      <form id="search-form" class="basic-card flower-card half-dotted-card">
        <label for="fname"
          >أدخلي اسمك الكامل للتحقق مما إذا كنت ضمن قائمة المقبولات
        </label>
        <div class="dotted-line"></div>
        <div class="form-inputs shared-filter">
          <input
            id="search-input"
            type="text"
            name="search-input"
            placeholder="الاسم الكامل"
          />
          <button id="search-btn" class="btn-primary flower-card">
            <span>بحث</span>
            <i class="fa-solid fa-magnifying-glass fa-flip-horizontal"></i>
          </button>
        </div>
      </form>

      <section id="name-list-container"></section>
    </main>
    <footer class="footer-card basic-card" dir="ltr" lang="en">
      <p>&copy; 2026 Al Tabib Alhafid. All rights reserved.</p>
      <div class="coder-credit">
        <p>Coded with ❤️ by</p>
        <a href="https://t.me/hadjer_pot"
          ><i class="fa-brands fa-telegram"></i> @hadjer_pot</a
        >
      </div>
    </footer>
    <script type="module" src="/scripts/student_manager.js"></script>
  </body>
</html>
